</div><div className="w sec" id="how"><p className="lab" style={{justifyContent:'center',display:'flex'}}>PROCESS</p><h2 style={{textAlign:'center'}}>From idea to <em>insight</em></h2><div className="grid" style={{marginTop:20}}>{H.map(h=><div className="card" key={h[0]}><div className="st">{h[0]}</div><p style={{color:'var(--t)'}}>{h[1]}</p></div>)}</div></div>
<div className="w sec" id="brands"><div className="g2"><div className="card"><div className="ic"><Ic n="Building2" s={22}/></div><h2>For Brands</h2><p>Launch with confidence. Upload creatives, pick your audience, compare options and get actionable reports.</p><button className="b bp" style={{marginTop:12}} onClick={()=>go('login','brand')}>Explore Brand Demo</button></div><div className="card" id="parts"><div className="ic"><Ic n="Smile" s={22}/></div><h2>For Participants</h2><p>Browse campaigns, share honest opinions, earn points and redeem them for rewards.</p><button className="b by" style={{marginTop:12}} onClick={()=>go('login','participant')}>Explore Participant Demo</button></div></div></div>
<div className="w sec"><p className="lab" style={{justifyContent:'center',display:'flex'}}>VOICES</p><h2 style={{textAlign:'center'}}>What people <em>say</em></h2><p className="tag" style={{textAlign:'center'}}>Sample testimonials for demo purposes only</p><div className="g3" style={{marginTop:24}}>{[['“We caught a weak tagline before spending on media.”','Sample Brand Manager'],['“Easy, quick and I earned a coffee voucher!”','Sample Participant'],['“The A/B comparison settled a long internal debate.”','Sample Marketing Lead']].map(t=><div className="card" key={t[1]}><p style={{color:'var(--t)'}}>{t[0]}</p><p className="tag">— {t[1]} (sample)</p></div>)}</div></div><div className="w" style={{paddingBottom:20}}><div className="cta"><Ribbon id="rc" style={{left:'-30px',top:'-50px',height:'420px',width:'220px'}}/><Ribbon id="rc2" soft style={{right:'-20px',bottom:'-90px',height:'360px',width:'190px',transform:'rotate(180deg)'}}/><p className="lab" style={{display:'flex',justifyContent:'center'}}>BEFORE YOU LAUNCH</p><h2 style={{fontSize:'clamp(36px,5vw,60px)'}}>Hear it from <em style={{color:'var(--s)'}}>people</em> first.</h2><p style={{color:'#c3d3c8',maxWidth:440,margin:'0 auto 28px'}}>Run your first test in minutes. No setup, no long contracts.</p><div className="row" style={{justifyContent:'center'}}><button className="b bp" onClick={()=>go('signup')}>Get started <Ic n="ArrowRight" s={15}/></button><button className="b by" onClick={()=>go('how')}>See how it works</button></div></div></div></div>}

function Footer({go}){return <footer><div className="w g2"><div><div className="lg" style={{color:'#fff'}}><Logo w/>POLLEN</div><p>Test Ideas. Understand People. Create Better Campaigns.</p></div><div><h3>Contact</h3><p>hello@pollen.com · Bengaluru, India</p><p><a onClick={()=>go('about')}>About</a> · <a onClick={()=>go('how')}>How it works</a></p></div><div><h3>Follow</h3><p><a href="#" onClick={e=>e.preventDefault()}>Instagram</a> · <a href="#" onClick={e=>e.preventDefault()}>LinkedIn</a> · <a href="#" onClick={e=>e.preventDefault()}>X</a></p><p className="tag" style={{color:'#cfd8cb'}}>Demo prototype – social links are placeholders</p></div></div></footer>}

function Auth({mode,role0,onAuth,go}){const [role,setRole]=useState(role0||'brand');const [e,setE]=useState('');const [p,setP]=useState('');const [n,setN]=useState('');const [err,setErr]=useState('');const su=mode==='signup';
const demo=r=>onAuth({role:r,name:r==='brand'?'Brand Demo Co':'Priya (Demo)',email:r==='brand'?'brand@pollen.com':'user@pollen.com'});
const sub=ev=>{ev.preventDefault();if(su){if(!n||!e||p.length<3)return setErr('Please fill all fields (password 3+ characters).');onAuth({role,name:n,email:e})}else{const ok=(e==='brand@pollen.com'&&p==='demo123'&&'brand')||(e==='user@pollen.com'&&p==='demo123'&&'participant');if(!ok)return setErr('Use a demo account below (password: demo123).');onAuth({role:ok,name:ok==='brand'?'Brand Demo Co':'Priya (Demo)',email:e})}};
return <div className="w sec" style={{maxWidth:880}}><div className="g2"><form className="card" onSubmit={sub}><h2>{su?'Create your account':'Welcome back'}</h2><div className="row" style={{marginTop:8}}>{['brand','participant'].map(r=><button type="button" key={r} className={'chip'+(role===r?' on':'')} onClick={()=>setRole(r)}>{r==='brand'?'Brand':'Participant'}</button>)}</div>
{su&&<><label>{role==='brand'?'Brand name':'Full name'}</label><input value={n} onChange={x=>setN(x.target.value)}/></>}<label>Email</label><input value={e} onChange={x=>setE(x.target.value)} placeholder={role==='brand'?'brand@pollen.com':'user@pollen.com'}/><label>Password</label><input type="password" value={p} onChange={x=>setP(x.target.value)} placeholder="demo123"/>
{err&&<p style={{color:'#b3402a'}}>{err}</p>}<button className="b bp" style={{marginTop:16,width:'100%',justifyContent:'center'}}>{su?'Sign Up':'Log In'}</button><p style={{marginTop:10}}>{su?'Have an account? ':'New here? '}<a style={{color:'var(--g2)',cursor:'pointer'}} onClick={()=>go(su?'login':'signup')}>{su?'Log in':'Sign up'}</a></p></form>
<div className="card"><h3>Demo accounts</h3><p>Brand: brand@pollen.com / demo123</p><p>Participant: user@pollen.com / demo123</p><button className="b bp" style={{width:'100%',margin:'12px 0 8px',justifyContent:'center'}} onClick={()=>demo('brand')}><Ic n="Building2"/>Explore Brand Demo</button><button className="b by" style={{width:'100%',justifyContent:'center'}} onClick={()=>demo('participant')}><Ic n="User"/>Explore Participant Demo</button></div></div></div>}

function BDash({S,go,open,flash}){const mine=S.campaigns.filter(c=>c.own);const tr=mine.reduce((a,c)=>a+stats(c,S.responses).n,0);const avgs=mine.map(c=>stats(c,S.responses).avg);
const K=[['Total campaigns',mine.length,'Megaphone'],['Active campaigns',mine.length,'Activity'],['Total responses',tr,'MessagesSquare'],['Audience engagement',Math.min(97,72+S.responses.length*2)+'%','TrendingUp']];
return <div className="w sec"><div className="row sp"><div><h1>Hello, {S.user.name} 👋</h1><p>Your brand dashboard</p></div><button className="b by" onClick={()=>go('wiz')}><Ic n="Plus"/>Create Campaign</button></div>
<div className="grid" style={{margin:'20px 0'}}>{K.map(k=><div className="card" key={k[0]}><div className="ic"><Ic n={k[2]} s={22}/></div><div className="st">{k[1]}</div><p>{k[0]}</p></div>)}</div>
<div className="card" style={{marginBottom:20}}><h3>Average rating by campaign</h3><Bars data={avgs.map(a=>+a.toFixed(2))} labels={mine.map(c=>c.name.split(' ').slice(0,2).join(' '))}/></div>
<h2>Your campaigns</h2><div className="grid">{mine.map(c=>{const s=stats(c,S.responses);return <div className="card h" key={c.id} style={{cursor:'pointer'}} onClick={()=>open(c.id)}><Cr c={c}/><h3 style={{marginTop:10}}>{c.name}</h3><div className="row"><span className="pill">{c.type}</span><span className="pill">{s.n} responses</span><span className="pill">★ {s.avg.toFixed(1)}</span></div><button className="b bp bs" style={{marginTop:12}}>View results <Ic n="ArrowRight" s={14}/></button></div>})}</div></div>}

function Wizard({S,upd,go,flash,open}){const [st,setSt]=useState(1);const [f,setF]=useState({name:'',desc:'',type:'Advertisement',media:null,mediaB:null,age:'18–34',loc:'India',gen:'All',int:['Food'],lang:'English',n:100,qs:[{id:1,t:'mc',q:'Which message feels most appealing?',o:['Option 1','Option 2','Option 3']},{id:2,t:'star',q:'How appealing is this creative?'}]});const [done,setDone]=useState(null);const [err,setErr]=useState('');
const set=(k,v)=>setF({...f,[k]:v});const up=(k,file)=>{if(file)set(k,{url:URL.createObjectURL(file),type:file.type})};
const next=()=>{if(st===1&&!f.name.trim())return setErr('Please enter a campaign name.');setErr('');setSt(st+1)};
const addQ=t=>set('qs',[...f.qs,{id:Date.now(),t,q:t==='mc'?'New multiple-choice question':t==='star'?'Rate this creative':'Share your thoughts',o:['Yes','Maybe','No']}]);
const uq=(i,k,v)=>set('qs',f.qs.map((q,j)=>j===i?{...q,[k]:v}:q));
const pub=()=>{const c={id:'c'+Date.now(),name:f.name,type:f.type,cat:'New',brand:S.user.name,desc:f.desc||'New campaign',pts:50,time:Math.max(2,f.qs.length+1),ab:!!f.mediaB,g:Math.floor(Math.random()*4),aud:`${f.age} · ${f.loc} · ${f.gen}`,seedN:0,seedR:[0,0,0,0,0],seedA:50,own:1,media:f.media,mediaB:f.mediaB,qs:f.qs,notes:{p:[],n:[]},target:f.n};upd(s=>({...s,campaigns:[c,...s.campaigns]}));setDone(c)};
if(done)return <div className="w sec" style={{maxWidth:560,textAlign:'center'}}><div className="card"><div style={{fontSize:56}}>🎉</div><h2>Campaign published!</h2><p>“{done.name}” is live and now appears in the Participant dashboard.</p><div className="row" style={{justifyContent:'center',marginTop:14}}><button className="b bp" onClick={()=>go('bdash')}>Go to Dashboard</button><button className="b bo" onClick={()=>open(done.id)}>View analytics</button></div></div></div>;
const ints=['Food','Fashion','Technology','Fitness','Travel','Gaming','Finance'];
return <div className="w sec" style={{maxWidth:760}}><button className="b bo bs" onClick={()=>st>1?setSt(st-1):go('bdash')}><Ic n="ArrowLeft" s={14}/>Back</button><h1 style={{marginTop:12}}>Create Campaign</h1><div className="steps">{[1,2,3,4].map(i=><div key={i} className={i<=st?'on':''}/>)}</div><p>Step {st} of 4 — {['Campaign details','Audience','Questions','Preview & publish'][st-1]}</p>
<div className="card" style={{marginTop:10}}>
{st===1&&<><label>Campaign name *</label><input value={f.name} onChange={e=>set('name',e.target.value)}/><label>Description</label><textarea rows="3" value={f.desc} onChange={e=>set('desc',e.target.value)}/><label>Campaign type</label><select value={f.type} onChange={e=>set('type',e.target.value)}>{['Advertisement','Poster','Video','Product Concept','Campaign Idea'].map(t=><option key={t}>{t}</option>)}</select>
<div className="g2"><div><label>Creative A (image/video)</label><input type="file" accept="image/*,video/*" onChange={e=>up('media',e.target.files[0])}/><Cr c={{...f,g:0}} which="A"/></div><div><label>Creative B (optional, for comparison)</label><input type="file" accept="image/*,video/*" onChange={e=>up('mediaB',e.target.files[0])}/>{f.mediaB?<Cr c={{...f,g:0}} which="B"/>:<p className="tag">No second option – A/B off</p>}</div></div></>}
{st===2&&<><div className="g2"><div><label>Age group</label><select value={f.age} onChange={e=>set('age',e.target.value)}>{['13–17','18–24','18–34','25–44','45+'].map(x=><option key={x}>{x}</option>)}</select></div><div><label>Location</label><select value={f.loc} onChange={e=>set('loc',e.target.value)}>{['India','Bengaluru','Mumbai','Delhi','Global'].map(x=><option key={x}>{x}</option>)}</select></div><div><label>Gender</label><select value={f.gen} onChange={e=>set('gen',e.target.value)}>{['All','Female','Male','Non-binary'].map(x=><option key={x}>{x}</option>)}</select></div><div><label>Language</label><select value={f.lang} onChange={e=>set('lang',e.target.value)}>{['English','Hindi','Kannada','Tamil'].map(x=><option key={x}>{x}</option>)}</select></div></div><label>Interests</label><div className="row">{ints.map(i=><button key={i} className={'chip'+(f.int.includes(i)?' on':'')} onClick={()=>set('int',f.int.includes(i)?f.int.filter(x=>x!==i):[...f.int,i])}>{i}</button>)}</div><label>Number of participants: {f.n}</label><input type="range" min="20" max="1000" step="10" value={f.n} onChange={e=>set('n',+e.target.value)}/></>}
{st===3&&<>{f.qs.map((q,i)=><div key={q.id} style={{borderBottom:'1px solid var(--bd)',paddingBottom:12}}><div className="row sp"><span className="pill">{{mc:'Multiple choice',star:'Star rating',text:'Written feedback'}[q.t]}</span><button className="b bs bo" onClick={()=>set('qs',f.qs.filter((_,j)=>j!==i))}><Ic n="Trash2" s={14}/></button></div><input style={{marginTop:6}} value={q.q} onChange={e=>uq(i,'q',e.target.value)}/>{q.t==='mc'&&<input style={{marginTop:6}} value={q.o.join(', ')} onChange={e=>uq(i,'o',e.target.value.split(',').map(x=>x.trim()))} placeholder="Options, comma separated"/>}</div>)}
<div className="row" style={{marginTop:12}}><button className="b bp bs" onClick={()=>addQ('mc')}><Ic n="ListChecks" s={14}/>Multiple choice</button><button className="b bp bs" onClick={()=>addQ('star')}><Ic n="Star" s={14}/>Star rating</button><button className="b bp bs" onClick={()=>addQ('text')}><Ic n="Type" s={14}/>Written</button></div></>}
{st===4&&<><h3>{f.name}</h3><p>{f.desc}</p><div className="g2"><Cr c={{...f,g:0}}/><Cr c={{...f,g:1}} which="B"/></div><p><b>{f.type}</b> · {f.age} · {f.loc} · {f.gen} · {f.lang} · {f.n} participants</p><p>Interests: {f.int.join(', ')||'Any'}</p><ol>{f.qs.map(q=><li key={q.id}>{q.q}</li>)}</ol></>}
{err&&<p style={{color:'#b3402a'}}>{err}</p>}
<div className="row sp" style={{marginTop:18}}><span/>{st<4?<button className="b bp" onClick={next}>Next <Ic n="ArrowRight" s={15}/></button>:<button className="b by" onClick={pub}><Ic n="Rocket" s={15}/>Publish campaign</button>}</div></div></div>}

function Analytics({c,S,go}){const s=stats(c,S.responses);const [toast,setT]=useState(0);const win=s.A>=s.B?'A':'B';
const fb=s.mine.filter(r=>r.text).map(r=>r.text);
const rep=()=>{const t=`POLLEN CAMPAIGN REPORT (SAMPLE)\n\nCampaign: ${c.name}\nType: ${c.type}\nAudience: ${c.aud}\nParticipants: ${s.n}\nAverage rating: ${s.avg.toFixed(2)}/5\nPreferred creative: Option ${win} (A:${s.A}, B:${s.B})\nRating distribution (1-5): ${s.dist.join(', ')}\n\nPositives:\n${c.notes.p.map(x=>'- '+x).join('\n')}\n\nNegatives:\n${c.notes.n.map(x=>'- '+x).join('\n')}\n\nLatest participant feedback:\n${fb.map(x=>'- '+x).join('\n')||'- none yet'}\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=c.name.replace(/\W+/g,'_')+'_report.txt';a.click()};
return <div className="w sec"><button className="b bo bs" onClick={()=>go('bdash')}><Ic n="ArrowLeft" s={14}/>Back to dashboard</button><div className="row sp" style={{margin:'12px 0'}}><div><h1>{c.name}</h1><span className="pill">{c.type}</span> <span className="pill">{c.aud}</span></div><button className="b by" onClick={rep}><Ic n="Download" s={16}/>Download Report</button></div>
<div className="grid">{[['Participants',s.n],['Total responses',s.tot],['Average rating',s.avg.toFixed(1)+' ★'],['Preferred creative','Option '+win]].map(k=><div className="card" key={k[0]}><div className="st">{k[1]}</div><p>{k[0]}</p></div>)}</div>
<div className="g2" style={{marginTop:16}}><div className="card"><h3>Rating distribution</h3><Bars data={s.dist} labels={['1★','2★','3★','4★','5★']}/></div><div className="card"><h3>Creative preference</h3><Donut a={s.A} b={s.B}/></div>
<div className="card"><h3>Audience demographics</h3><Hb l="Age 18–24" v={38}/><Hb l="Age 25–34" v={34}/><Hb l="Age 35+" v={28}/><Hb l="Female" v={54}/><Hb l="Male" v={43}/></div>
<div className="card"><h3>Feedback summary</h3><p style={{color:'var(--t)'}}>Overall sentiment is {s.avg>=3.8?'positive':'mixed'}. Option {win} is preferred by most participants.</p><h3 style={{marginTop:12,fontSize:16,color:'var(--g2)'}}>👍 Positive</h3><ul>{c.notes.p.map(x=><li key={x}>{x}</li>)}{!c.notes.p.length&&<li className="tag">Waiting for responses…</li>}</ul><h3 style={{fontSize:16,color:'#b3402a'}}>👎 Negative</h3><ul>{c.notes.n.map(x=><li key={x}>{x}</li>)}{!c.notes.n.length&&<li className="tag">Waiting for responses…</li>}</ul></div></div>
<div className="card" style={{marginTop:16}}><h3>Latest participant feedback ({fb.length})</h3>{s.mine.length?<table><thead><tr><th>Participant</th><th>Rating</th><th>Pick</th><th>Opinion</th></tr></thead><tbody>{s.mine.slice().reverse().map((r,i)=><tr key={i}><td>{r.user}</td><td>{'★'.repeat(r.rating)}</td><td>{r.pref||'–'}</td><td>{r.text||'–'}</td></tr>)}</tbody></table>:<p>No live submissions yet. Complete this campaign as a participant to see it here.</p>}</div></div>}

function PDash({S,go,start}){const [cat,setCat]=useState('All');const cats=['All',...new Set(S.campaigns.map(c=>c.cat))];const av=S.campaigns.filter(c=>!S.done.includes(c.id)&&(cat==='All'||c.cat===cat));const dn=S.campaigns.filter(c=>S.done.includes(c.id));
return <div className="w sec"><div className="row sp"><div><h1>Hi, {S.user.name} 🌼</h1><p>Share opinions, earn points.</p></div><button className="b by" onClick={()=>go('rewards')}><Ic n="Coins"/>{S.points} pts</button></div>
<div className="row" style={{margin:'16px 0'}}>{cats.map(c=><button key={c} className={'chip'+(cat===c?' on':'')} onClick={()=>setCat(c)}>{c}</button>)}</div>
<div className="grid">{av.map(c=><div className="card h" key={c.id}><Cr c={c}/><h3 style={{marginTop:10}}>{c.name}</h3><p>{c.desc}</p><div className="row"><span className="pill">{c.cat}</span><span className="pill"><Ic n="Clock" s={11}/> ~{c.time} min</span><span className="pill">+{c.pts} pts</span></div><button className="b bp" style={{marginTop:12,width:'100%',justifyContent:'center'}} onClick={()=>start(c.id)}>Start Campaign</button></div>)}{!av.length&&<p>No campaigns in this category.</p>}</div>
{dn.length>0&&<><h2 style={{marginTop:30}}>Completed ✅</h2><div className="grid">{dn.map(c=><div className="card" key={c.id} style={{opacity:.75}}><h3>{c.name}</h3><span className="pill">Completed · +{c.pts} pts</span></div>)}</div></>}</div>}

function Test({c,S,upd,go,flash}){const [r,setR]=useState(0);const [rb,setRb]=useState(0);const [pref,setPref]=useState('');const [ans,setAns]=useState({});const [tx,setTx]=useState('');const [ok,setOk]=useState(false);const [err,setErr]=useState('');
const submit=()=>{if(!r)return setErr('Please rate the creative with stars.');upd(s=>({...s,points:s.points+c.pts,earned:s.earned+c.pts,done:[...s.done,c.id],responses:[...s.responses,{cid:c.id,rating:r,ratingB:rb,pref,ans,text:tx||Object.values(ans).filter(x=>typeof x==='string'&&x.length>12).join(' '),user:S.user.name}]}));setOk(true)};
if(ok)return <div className="w sec" style={{maxWidth:520,textAlign:'center'}}><div className="card"><div style={{fontSize:56}}>🌼</div><h2>Thank you!</h2><p>Your opinion has been submitted. You earned <b>+{c.pts} points</b>.</p><div className="st" style={{margin:'10px 0'}}>{S.points} pts</div><div className="row" style={{justifyContent:'center'}}><button className="b bp" onClick={()=>go('pdash')}>More campaigns</button><button className="b by" onClick={()=>go('rewards')}>Go to Rewards</button></div></div></div>;
return <div className="w sec" style={{maxWidth:760}}><button className="b bo bs" onClick={()=>go('pdash')}><Ic n="ArrowLeft" s={14}/>Back</button><h1 style={{marginTop:12}}>{c.name}</h1><p>{c.desc} · {c.brand}</p>
<div className="card" style={{marginTop:12}}>{c.ab?<><h3>Compare the two options</h3><div className="g2"><div><Cr c={c} which="A"/><Stars v={r} on={setR}/></div><div><Cr c={c} which="B"/><Stars v={rb} on={setRb}/></div></div><label>Which do you prefer?</label><div className="row">{['A','B'].map(x=><button key={x} className={'chip'+(pref===x?' on':'')} onClick={()=>setPref(x)}>Option {x}</button>)}</div></>:<><Cr c={c}/><h3 style={{marginTop:10}}>Rate this creative *</h3><Stars v={r} on={setR}/></>}
{c.qs.filter(q=>q.t!=='star').map(q=><div key={q.id}><label>{q.q}</label>{q.t==='mc'?q.o.map(o=><button key={o} className={'opt'+(ans[q.id]===o?' on':'')} onClick={()=>setAns({...ans,[q.id]:o})}>{o}</button>):<textarea rows="2" value={ans[q.id]||''} onChange={e=>setAns({...ans,[q.id]:e.target.value})}/>}</div>)}
<label>Your honest opinion</label><textarea rows="3" value={tx} onChange={e=>setTx(e.target.value)} placeholder="What did you like or dislike?"/>{err&&<p style={{color:'#b3402a'}}>{err}</p>}<button className="b by" style={{marginTop:14}} onClick={submit}><Ic n="Send" s={15}/>Submit & earn {c.pts} pts</button></div></div>}

function Rewards({S,upd,go}){const [m,setM]=useState(null);const red=r=>{if(S.points<r.p)return;upd(s=>({...s,points:s.points-r.p,redeemed:[...s.redeemed,{...r,code:'POL-'+Math.random().toString(36).slice(2,8).toUpperCase()}]}));setM(r)};const last=S.redeemed[S.redeemed.length-1];
return <div className="w sec"><button className="b bo bs" onClick={()=>go('pdash')}><Ic n="ArrowLeft" s={14}/>Back</button><div className="grid" style={{margin:'16px 0'}}><div className="card"><div className="st">{S.points}</div><p>Total points</p></div><div className="card"><div className="st">{S.earned}</div><p>Points earned (lifetime)</p></div><div className="card"><div className="st">{S.redeemed.length}</div><p>Rewards redeemed</p></div></div>
<h2>Available rewards</h2><div className="grid">{REW.map(r=><div className="card h" key={r.id}><div className="cr" style={{background:r.c,height:90}}><span><Ic n="Gift" s={28}/></span></div><h3 style={{marginTop:10}}>{r.n}</h3><p>{r.p} points</p><button className={'b bs '+(S.points>=r.p?'by':'bo')} disabled={S.points<r.p} style={{opacity:S.points<r.p?.5:1}} onClick={()=>red(r)}>{S.points>=r.p?'Redeem':'Need '+(r.p-S.points)+' more'}</button></div>)}</div>
{S.redeemed.length>0&&<div className="card" style={{marginTop:20}}><h3>My vouchers</h3><table><tbody>{S.redeemed.map((x,i)=><tr key={i}><td>{x.n}</td><td><b>{x.code}</b></td></tr>)}</tbody></table></div>}
{m&&<div className="modal" onClick={()=>setM(null)}><div className="card" onClick={e=>e.stopPropagation()}><div style={{fontSize:48}}>🎁</div><h2>Redeemed!</h2><p>{m.n}</p><p>Code: <b>{last&&last.code}</b></p><p className="tag">Demo only – no real voucher issued.</p><button className="b bp" onClick={()=>setM(null)}>Done</button></div></div>}</div>}

function Profile({S,go}){const u=S.user;return <div className="w sec" style={{maxWidth:560}}><button className="b bo bs" onClick={()=>go('pdash')}><Ic n="ArrowLeft" s={14}/>Back</button><div className="card" style={{marginTop:12,textAlign:'center'}}><div className="ic" style={{margin:'0 auto',width:72,height:72,borderRadius:99}}><Ic n="User" s={34}/></div><h2>{u.name}</h2><p>{u.email}</p><div className="row" style={{justifyContent:'center',margin:'10px 0'}}><span className="pill">{S.points} points</span><span className="pill">{S.done.length} completed</span><span className="pill">{S.redeemed.length} rewards</span></div><p>Interests: Food, Technology, Fashion · Language: English · Location: India</p></div></div>}

function About({go}){return <div className="w sec" style={{maxWidth:800}}><h1>About POLLEN</h1><p style={{fontSize:18}}>POLLEN – A Community of Opinions and Ideas – connects brands with real people to test advertisements, posters, videos, social media creatives and campaign ideas before launch.</p><div className="g2" style={{marginTop:20}}>{[['Target','Mission','Help brands understand people before they launch, and reward people for honest opinions.'],['Eye','Vision','A world where every campaign is shaped by the voices of the people it is meant for.'],['Heart','Purpose','Make creative testing simple, human and rewarding for brands and participants alike.']].map(x=><div className="card" key={x[1]}><div className="ic"><Ic n={x[0]} s={22}/></div><h3>{x[1]}</h3><p>{x[2]}</p></div>)}</div><h2 style={{marginTop:36}}>Brand identity</h2><div className="grid" style={{marginTop:12}}>{[['#0a1714','#bcdc8f'],['#bcdc8f','#0a1714'],['#eef3e8','#0a1714']].map(([bg,fg])=><div key={bg} style={{background:bg,color:fg,borderRadius:20,height:130,display:'flex',alignItems:'center',justifyContent:'center',gap:10,fontSize:28,fontWeight:800,letterSpacing:'.05em',border:'1px solid var(--bd)'}}><Logo s={46} c={fg}/>POLLEN</div>)}</div><div className="row" style={{marginTop:12}}>{['#0a1714','#bcdc8f','#eef3e8'].map(x=><span className="pill" key={x}>{x}</span>)}</div><button className="b bp" style={{marginTop:20}} onClick={()=>go('login')}>Join POLLEN</button></div>}

function App(){const [S,setS]=useState(load);const [v,setV]=useState('home');const [arg,setArg]=useState(null);const [role0,setR0]=useState('brand');const [toast,setT]=useState('');
useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},[S]);
const upd=f=>setS(f);const flash=m=>{setT(m);setTimeout(()=>setT(''),2200)};
const go=(k,a)=>{if(k==='login'&&a)setR0(a);if(['how','brands','parts'].includes(k)){setV('home');setArg(k);return}setArg(null);setV(k);window.scrollTo(0,0)};
const onAuth=u=>{setS(s=>({...s,user:u}));setV(u.role==='brand'?'bdash':'pdash');flash('Welcome, '+u.name+'!')};
const out=()=>{setS(s=>({...s,user:null}));setV('home');flash('Logged out')};
const reset=()=>{if(confirm('Reset all demo data?')){localStorage.removeItem(KEY);setS(seed());setV('home');flash('Demo reset')}};
const guard=(role,el)=>S.user&&S.user.role===role?el:<Auth mode="login" role0={role} onAuth={onAuth} go={go}/>;
const cur=S.campaigns.find(c=>c.id===arg);
let page;
if(v==='home')page=<Home go={go} S={S} sec={arg}/>;
else if(v==='about')page=<About go={go}/>;
else if(v==='login'||v==='signup')page=<Auth mode={v} role0={role0} onAuth={onAuth} go={go}/>;
else if(v==='bdash')page=guard('brand',<BDash S={S} go={go} flash={flash} open={id=>{setArg(id);setV('ana')}}/>);
else if(v==='wiz')page=guard('brand',<Wizard S={S} upd={upd} go={go} flash={flash} open={id=>{setArg(id);setV('ana')}}/>);
else if(v==='ana')page=guard('brand',cur?<Analytics c={cur} S={S} go={go}/>:null);
else if(v==='pdash')page=guard('participant',<PDash S={S} go={go} start={id=>{setArg(id);setV('test');window.scrollTo(0,0)}}/>);
else if(v==='test')page=guard('participant',cur?<Test c={cur} S={S} upd={upd} go={go} flash={flash}/>:null);
else if(v==='rewards')page=guard('participant',<Rewards S={S} upd={upd} go={go}/>);
else if(v==='profile')page=guard('participant',<Profile S={S} go={go}/>);
const appV=S.user&&['bdash','wiz','ana','pdash','test','rewards','profile'].includes(v);const isB=S.user&&S.user.role==='brand';
const items=isB?[['bdash','LayoutDashboard','Dashboard'],['wiz','PlusCircle','New campaign']]:[['pdash','Compass','Discover'],['rewards','Gift','Rewards'],['profile','User','Profile']];const act=v==='ana'?'bdash':v==='test'?'pdash':v;
if(appV)return <div className="app"><aside className="side"><div className="lg" onClick={()=>go('home')}><Logo/>POLLEN</div><div className="sn">{items.map(([k,i,l])=><button key={k} className={'si'+(act===k?' on':'')} onClick={()=>go(k)}><Ic n={i} s={18}/><span>{l}</span></button>)}</div><div className="su"><div className="av">{S.user.name[0]}</div><div><b>{S.user.name}</b><p>{isB?'Brand account':S.points+' points'}</p></div></div><button className="si" onClick={reset}><Ic n="RotateCcw" s={18}/><span>Reset demo</span></button><button className="si" onClick={out}><Ic n="LogOut" s={18}/><span>Sign out</span></button></aside><main className="main"><div className="top"><div><b>{isB?'Brand workspace':'Participant app'}</b></div>{isB?<button className="b by bs" onClick={()=>go('wiz')}><Ic n="Plus" s={15}/>Create Campaign</button>:<button className="b by bs" onClick={()=>go('rewards')}><Ic n="Coins" s={15}/>{S.points} pts</button>}</div>{page}</main>{toast&&<div className="toast">{toast}</div>}</div>;
return <div><Nav go={go} view={v==='home'?(arg||'home'):v} S={S} out={out}/>
{S.user&&S.user.role==='participant'&&<div className="w row" style={{padding:'10px 20px'}}><button className="chip" onClick={()=>go('pdash')}>Campaigns</button><button className="chip" onClick={()=>go('rewards')}>Rewards · {S.points} pts</button><button className="chip" onClick={()=>go('profile')}>Profile</button></div>}
{page}<Footer go={go}/>
<div style={{textAlign:'center',padding:10}}><button className="b bo bs" onClick={reset}><Ic n="RotateCcw" s={14}/>Reset demo data</button></div>
{toast&&<div className="toast">{toast}</div>}</div>}
ReactDOM.createRoot(document.getElementById('r')).render(<App/>);
</script></body></html>
